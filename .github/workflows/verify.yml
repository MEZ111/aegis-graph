name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: PYTHONPATH=src python -m unittest -v tests/test_aegis_graph.py
      - run: aegis-graph examples/model.json --format mermaid -o /tmp/graph.md
